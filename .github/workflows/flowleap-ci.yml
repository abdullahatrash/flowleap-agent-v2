# Fork-owned PR gate for flowleap-agent-v2.
#
# Deliberately minimal and cheap: catches TypeScript errors and layering
# violations without a full product build. Runs on ubuntu-latest (no
# Microsoft-internal self-hosted pools) and uses no secrets beyond the
# default GITHUB_TOKEN.
#
# Package manager: pnpm 12 (PRD 0027). `./.github/actions/setup-pnpm` (vendored
# from upstream) installs the version that `packageManager` in package.json
# pins; it runs BEFORE actions/setup-node so that `cache: pnpm` can locate the
# pnpm store. One root `pnpm install --frozen-lockfile` also installs the
# separate roots (build/, extensions/, extensions/copilot — see
# build/npm/dirs.ts) through the root postinstall (build/npm/postinstall.ts).
# The install is retried like upstream's pr.yml does, because the registry
# and the native-module header downloads flake on shared runners.
name: FlowLeap CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flowleap-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-and-layers:
    name: Compile & Layers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # @vscode/ripgrep's postinstall hits the GitHub API to download a
      # release asset; anonymous requests are rate-limited and flake on
      # shared runners.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Native modules built during pnpm install need system headers:
      # kerberos -> libkrb5-dev, native-keymap -> libxkbfile-dev.
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libkrb5-dev libxkbfile-dev

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done

      # The Markdown editor's command, keybinding and menu contributions are
      # generated from @vscode/markdown-editor/commands, so a stale manifest is
      # invisible until someone rebuilds. This is the guard.
      - name: Check Markdown editor manifests
        run: pnpm run markdown-editor-package-json-check

      # Compile gate: two lightweight tsgo type-check passes instead of the
      # full `pnpm run compile` (which esbuild-bundles the client and the
      # copilot extension — much heavier and not needed just to catch type
      # errors).
      #   1. typecheck-client type-checks src/tsconfig.json (main VS Code
      #      sources under src/vs/*).
      #   2. `gulp compile-extensions` type-checks every built-in extension
      #      under extensions/ (via tsgo, no bundling) except extensions/copilot,
      #      which ships its own dedicated `typecheck` script covering its
      #      multiple tsconfig projects.
      # Together these cover TypeScript errors in both src/ and extensions/
      # without producing a bundled build artifact.
      - name: Type-check client (src/)
        run: pnpm run typecheck-client

      - name: Type-check built-in extensions
        run: pnpm run gulp compile-extensions

      - name: Type-check copilot extension
        run: pnpm -C extensions/copilot run typecheck

      # Runs against the JavaScript emitted into extensions/pdf-preview/out by
      # the `gulp compile-extensions` step above.
      - name: Test pdf-preview extension
        run: pnpm -C extensions/pdf-preview test

      - name: Validate layers
        run: pnpm run valid-layers-check

      # Every module the product spawns as a process or worker must be listed
      # as a bundle entry point in build/next/index.ts, or the packaged app
      # ships without it (#511). The release workflow checks the built product;
      # this catches the same hole on the pull request, without a build.
      - name: Check spawned entry points are bundled
        run: node build/flowleap/verify-entry-points.mjs

  copilot-unit-tests:
    name: Copilot Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # @vscode/ripgrep's postinstall hits the GitHub API to download a
      # release asset; anonymous requests are rate-limited and flake on
      # shared runners.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The unit tests read the committed simulation cache
      # (extensions/copilot/test/simulation/cache/*.sqlite), which lives in
      # Git LFS. A plain checkout leaves LFS pointer files behind and every
      # cache-backed spec fails with "file is not a database". The objects
      # (~260 MB) are cached by their LFS ids so a run only downloads them
      # when a .sqlite file actually changes.
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: git lfs pull

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Native modules built during pnpm install need system headers:
      # kerberos -> libkrb5-dev, native-keymap -> libxkbfile-dev.
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libkrb5-dev libxkbfile-dev

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done

      # The diff service and notebook specs spawn dist/diffWorker.js, which
      # only exists after the esbuild dev bundle (a few seconds).
      - name: Build copilot extension bundles
        run: pnpm -C extensions/copilot run compile

      # Vitest unit tests for the copilot extension. The opt-in live provider
      # specs (*.live.spec.ts) skip themselves unless PATENT_ROUTING_LIVE_EVAL
      # is set, which CI deliberately leaves unset so no metered provider call
      # is ever made here.
      - name: Run copilot unit tests
        run: pnpm -C extensions/copilot run test:unit

  skills-drift:
    name: Bundled Skills Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout flowleap-agent-v2
        uses: actions/checkout@v6
        with:
          path: flowleap-agent-v2

      # This job never installs the repo's dependencies (the drift check needs
      # none), so `pnpm dlx` fetches tsx on the fly — the pnpm equivalent of
      # the old `npx tsx`. The repo is checked out into a subfolder, so the
      # vendored ./.github/actions/setup-pnpm (which reads package.json at the
      # workspace root) does not apply here: the same pinned pnpm/action-setup
      # is used directly and told where package.json is.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: flowleap-agent-v2/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: flowleap-agent-v2/.nvmrc

      # A checkout pinned to the tag recorded as `ref` in the drift
      # manifest — no further network call at check time since
      # check-skills-drift.ts reads straight out of the local git object
      # database. Keep this in sync with scripts/skills-drift-manifest.json's
      # `ref`/`refDisplayName` — they must name the same commit.
      - name: Checkout flowleap-cli @ pinned ref
        uses: actions/checkout@v6
        with:
          repository: flowleap-ai/flowleap-cli
          ref: v0.12.0
          path: flowleap-cli
          fetch-depth: 1

      - name: Check bundled skills for drift
        run: pnpm dlx tsx scripts/check-skills-drift.ts --require-source
        working-directory: flowleap-agent-v2
        env:
          FLOWLEAP_CLI_DIR: ${{ github.workspace }}/flowleap-cli
