# FlowLeap Release Workflow
#
# Ported and modernized from the old fork's release-flowleap.yml (issue #81).
# Builds "Flow Leap, AI patent agent" for macOS (x64 + arm64), Windows (x64 + arm64)
# and Linux (x64 + arm64), then drafts a GitHub release with checksums.
#
# Modernizations vs. the old workflow:
#   - macOS DMGs are notarized SYNCHRONOUSLY (notarytool --wait), the job FAILS on
#     rejection, and the DMG is stapled + Gatekeeper-verified before upload, so the
#     artifact attached to the release is final.
#   - Every macOS build also ships a per-arch Squirrel archive (a .zip of the
#     signed, notarized, stapled .app) for the native Silent Update path
#     (ADR 0008), and the release-time stamping makes it a Stamped Build
#     (updateUrl + quality land in the built product.json).
#   - Per-extension build steps trimmed to only what this fork actually needs
#     (see the "Compile FlowLeap legacy extensions" step comment).
#   - Windows stays unsigned in CI; signing is a documented local step. arm64 is
#     cross-built on the x64 runner, which is how upstream does it too — see the
#     build-windows job comment.
#   - Linux ships .deb, .rpm and .tar.gz per arch, built natively on
#     ubuntu-22.04 / ubuntu-22.04-arm (glibc 2.35 baseline). Unsigned, and
#     deliberately not a Stamped Build — see the build-linux job comment.
#   - A workflow_dispatch can narrow the build to one platform and skip the
#     release draft entirely (the `platforms` and `dry_run` inputs), so a
#     pipeline change can be exercised without minting a release.
name: FlowLeap Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      # These two inputs exist so one platform can be exercised without minting
      # a release. On a tag push neither is set, so every expression below falls
      # back to "build everything and draft the release" — the real behaviour.
      platforms:
        description: 'Which platforms to build'
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
      dry_run:
        description: 'Dry run: build and upload artifacts only, do NOT draft a GitHub release'
        required: false
        default: false
        type: boolean

# Only one release build per ref at a time; a newer push supersedes an in-flight run.
concurrency:
  group: flowleap-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VSCODE_QUALITY: stable
  # Memory optimization for large builds
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  # Build for macOS (both architectures)
  build-macos:
    # Empty on a tag push (no dispatch inputs) — which means "build it".
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-14
    # Larger than the old 90m budget: notarytool --wait can add up to 45m to the job.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Root `npm ci` also installs each built-in extension's node_modules (they are
      # listed in build/npm/dirs.ts, including pdf-preview / flowleap / markdown-pdf /
      # docx-viewer). That is why the old per-extension `npm install --production`
      # steps for markdown-pdf and docx-viewer are gone — they were redundant.
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.arch }}

      # npm never fails an install over an optional dependency, so a skipped
      # per-platform native package is silent. Catch it before packaging rather
      # than shipping a binary-less artifact (see build/npm/checkNativeOptionalDeps.ts).
      - name: Verify native optional dependencies
        run: node build/npm/checkNativeOptionalDeps.ts

      # Stamp BEFORE packaging so the version lands in the bundled extension's
      # package.json (the `vscode-darwin-*` task copies it in via vsce.listFiles).
      - name: Stamp FlowLeap version
        run: node build/flowleap/stamp-flowleap-version.mjs
        env:
          FLOWLEAP_VERSION: ${{ inputs.version || github.ref_name }}

      # Stamp the native-updater fields (updateUrl + quality) into the ROOT
      # product.json BEFORE the gulp package task, so the built app is a
      # Stamped Build (ADR 0008). The gulp build injects `commit` (the real
      # source sha) and `date` itself; the checked-in product.json keeps
      # neither field, so dev/local builds stay inert.
      - name: Stamp update configuration
        run: node build/flowleap/stamp-update-config.mjs

      # All *standard* built-in extensions (git, typescript, markdown, ...) use esbuild
      # and self-compile during the `vscode-darwin-*` package task, so they need no step
      # here. The FlowLeap-specific extensions are the exception: pdf-preview, flowleap
      # and docx-viewer are legacy TS extensions (main -> ./out/extension) that the
      # packaging stream only *bundles* (via vsce.listFiles reading out/) — it does not
      # compile them — so their out/ must exist first. markdown-pdf is pure JS and needs
      # no compile. NOTE: the old workflow compiled only pdf-preview + flowleap and
      # missed docx-viewer; that omission is fixed here.
      - name: Compile FlowLeap legacy extensions
        run: |
          npm run gulp compile-extension:pdf-preview
          npm run gulp compile-extension:flowleap
          npm run gulp compile-extension:docx-viewer

      - name: Build macOS ${{ matrix.arch }}
        run: |
          ulimit -n 65536 2>/dev/null || true
          npm run gulp vscode-darwin-${{ matrix.arch }}
        env:
          VSCODE_ARCH: ${{ matrix.arch }}

      # macos-14 runners are arm64, so the x64 leg is a cross-build and hits the
      # same trap the Windows arm64 leg did (#461): npm installs the HOST's
      # @img/sharp platform package, which packaging then has to correct. Check
      # it here, before signing, so a wrong-architecture binary never gets
      # signed and notarized. `lipo -archs` reports x86_64 for an x64 slice.
      - name: Verify macOS Artifacts
        run: |
          set -e
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in
            x64) EXPECTED=x86_64 ;;
            arm64) EXPECTED=arm64 ;;
            *) echo "::error::Unknown arch $ARCH"; exit 1 ;;
          esac

          # Derive the bundle and its executable rather than hardcoding names:
          # the .app is named after product.nameLong and the binary inside after
          # nameShort, and both have been renamed before now.
          APP=$(ls -d "../VSCode-darwin-$ARCH/"*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle found in ../VSCode-darwin-$ARCH"
            ls -la "../VSCode-darwin-$ARCH" || true
            exit 1
          fi
          echo "App bundle: $APP"
          RES="$APP/Contents/Resources/app"

          MAIN=$(ls "$APP/Contents/MacOS/"* 2>/dev/null | head -1)
          if [ -z "$MAIN" ]; then
            echo "::error::No executable found in $APP/Contents/MacOS"
            exit 1
          fi
          echo "=== main executable ($MAIN) ==="
          lipo -archs "$MAIN"
          if ! lipo -archs "$MAIN" | tr ' ' '\n' | grep -qx "$EXPECTED"; then
            echo "::error::$MAIN is not $EXPECTED — the cross-build did not take effect."
            exit 1
          fi

          SHARP="$RES/extensions/copilot/node_modules/@img/sharp-darwin-$ARCH/lib/sharp-darwin-$ARCH.node"
          echo "=== shipped sharp binary ==="
          if [ ! -f "$SHARP" ]; then
            echo "::error::Target sharp binary not found at $SHARP."
            echo "Either ensureSharpPlatformPackage did not run, or the macOS build"
            echo "does not ship @img/sharp at all — check which before assuming a bug:"
            ls -1 "$RES/extensions/copilot/node_modules/@img" 2>/dev/null || echo "(no @img directory at all)"
            exit 1
          fi
          lipo -archs "$SHARP"
          if ! lipo -archs "$SHARP" | tr ' ' '\n' | grep -qx "$EXPECTED"; then
            echo "::error::The shipped sharp binary is not $EXPECTED."
            exit 1
          fi

          echo "OK: the $ARCH app and its shipped sharp binary are both $EXPECTED."

      # Code Signing — uses the user's standard electron-builder secret names:
      #   CSC_LINK          base64-encoded .p12 "Developer ID Application" certificate
      #   CSC_KEY_PASSWORD  the .p12 password
      # The temporary keychain password is generated per-run (no secret), and the
      # signing identity is auto-discovered from the imported cert (no MACOS_DEVELOPER_ID
      # secret). The discovered identity is exported for the signing step.
      - name: Import Code Signing Certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Ephemeral, per-run keychain password (never stored as a secret).
          KEYCHAIN_PWD=$(openssl rand -base64 24)

          # Import certificate from secret
          echo -n "$CSC_LINK" | base64 --decode -o "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import certificate to keychain
          security import "$CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Auto-discover the "Developer ID Application" identity from the imported cert.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"' || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' signing identity found in the imported certificate (check CSC_LINK / CSC_KEY_PASSWORD)."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "Discovered signing identity: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Comprehensive Electron codesign (kept verbatim from the old fork — this ordering
      # worked in production): all Mach-O binaries first, then frameworks deepest-first,
      # then helper apps with entitlements, then the main app with entitlements.
      - name: Sign Application
        run: |
          APP_PATH="../VSCode-darwin-${{ matrix.arch }}/Flow Leap, AI patent agent.app"

          # $SIGNING_IDENTITY is exported by the certificate-import step.
          if [ -z "${SIGNING_IDENTITY:-}" ]; then
            echo "::error::SIGNING_IDENTITY is not set; certificate import must have failed."
            exit 1
          fi

          echo "=== Signing Electron app (comprehensive) with: $SIGNING_IDENTITY ==="

          # Step 1: Sign ALL executable files in the entire app bundle
          # This catches everything: rg, spawn-helper, chrome_crashpad_handler, ShipIt, etc.
          echo "Step 1: Signing all executables and binaries..."
          find "$APP_PATH" -type f \( \
            -name "*.dylib" -o \
            -name "*.so" -o \
            -name "*.node" -o \
            -perm +111 \
          \) | while read -r binary; do
            # Skip directories and non-macho files
            if file "$binary" | grep -q "Mach-O"; then
              echo "  Signing: $binary"
              codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$binary" 2>&1 || echo "  Warning: Failed to sign $binary"
            fi
          done

          # Step 2: Sign all .framework bundles (deepest first by sorting by path length)
          echo "Step 2: Signing framework bundles..."
          find "$APP_PATH" -type d -name "*.framework" | awk '{print length, $0}' | sort -rn | cut -d' ' -f2- | while read -r framework; do
            echo "  Signing framework: $framework"
            codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$framework" 2>&1 || echo "  Warning: Failed to sign $framework"
          done

          # Step 3: Sign all helper .app bundles WITH ENTITLEMENTS (required for JIT in renderer)
          echo "Step 3: Signing helper apps with entitlements..."
          find "$APP_PATH/Contents/Frameworks" -type d -name "*.app" | while read -r helper; do
            echo "  Signing helper: $helper"
            codesign --force --options runtime --timestamp --entitlements build/entitlements.plist --sign "$SIGNING_IDENTITY" "$helper" 2>&1 || echo "  Warning: Failed to sign $helper"
          done

          # Step 4: Sign the main app bundle with entitlements
          echo "Step 4: Signing main app bundle with entitlements..."
          codesign --force --options runtime --timestamp --entitlements build/entitlements.plist --sign "$SIGNING_IDENTITY" "$APP_PATH"

          # Verify signature
          echo "=== Verifying signature ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          npm install -g create-dmg
          mkdir -p dist
          APP_NAME="Flow Leap, AI patent agent.app"
          APP_PATH="../VSCode-darwin-${{ matrix.arch }}/$APP_NAME"
          DMG_NAME="FlowLeap-${{ inputs.version || github.ref_name }}-darwin-${{ matrix.arch }}.dmg"

          if [ ! -e "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi

          # create-dmg can exit non-zero even on success (e.g. when it cannot
          # re-sign), so success is decided by whether a .dmg actually appeared.
          # No fallback: a missing DMG fails the job, so no artifact can ever
          # ship un-notarized.
          echo "Attempting create-dmg..."
          create-dmg "$APP_PATH" --overwrite --dmg-title="FlowLeap" || echo "::warning::create-dmg exited non-zero; checking for output before deciding"

          if ls ./*.dmg >/dev/null 2>&1; then
            mv ./*.dmg "dist/$DMG_NAME"
            echo "DMG created: dist/$DMG_NAME"
          else
            echo "::error::create-dmg produced no .dmg; failing the build (un-notarized artifacts must never ship)"
            exit 1
          fi

          ls -la dist/

      # Notarization: submit SYNCHRONOUSLY and staple, so the uploaded DMG is final.
      # The job FAILS if Apple rejects notarization (the notarytool log is printed for
      # diagnosis) and also if the DMG is missing — every shipped artifact must be
      # notarized.
      - name: Notarize and Staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="dist/FlowLeap-${{ inputs.version || github.ref_name }}-darwin-${{ matrix.arch }}.dmg"

          if [ ! -f "$DMG_PATH" ]; then
            echo "::error::No DMG found at $DMG_PATH; nothing to notarize."
            exit 1
          fi

          echo "Submitting $DMG_PATH to the Apple notary service (waiting up to 45m)..."
          set +e
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 45m 2>&1)
          SUBMIT_STATUS=$?
          set -e

          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -oE 'id: [a-f0-9-]+' | head -1 | awk '{print $2}')

          # notarytool --wait may exit 0 even when the submission is Invalid, so check the
          # status text as well as the exit code.
          if [ $SUBMIT_STATUS -ne 0 ] || echo "$SUBMIT_OUTPUT" | grep -qiE 'status:[[:space:]]*(Invalid|Rejected)'; then
            echo "::error::Notarization was not accepted for $DMG_PATH"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "=== notarytool log ($SUBMISSION_ID) ==="
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

          echo "Notarization accepted. Stapling..."
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          echo "Gatekeeper assessment of the stapled DMG..."
          spctl -a -t open --context context:primary-signature -v "$DMG_PATH"

          echo "DMG is signed, notarized and stapled: $DMG_PATH"

      # Squirrel.Mac cannot install a .dmg — it needs a .zip of the signed,
      # notarized, stapled .app (ADR 0008). The DMG notarization above covers
      # the nested app bundle, so its ticket is stapled directly onto the .app
      # before archiving. ditto -c -k --keepParent produces the archive layout
      # Squirrel.Mac expects. The .dmg remains the human download.
      - name: Create Squirrel Archive (notarized app zip)
        run: |
          APP_PATH="../VSCode-darwin-${{ matrix.arch }}/Flow Leap, AI patent agent.app"
          ZIP_PATH="dist/FlowLeap-${{ inputs.version || github.ref_name }}-darwin-${{ matrix.arch }}.zip"

          echo "Stapling the notarization ticket onto the app bundle..."
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          echo "Gatekeeper assessment of the stapled app..."
          spctl --assess --type execute -vv "$APP_PATH"

          echo "Creating Squirrel archive..."
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          ls -la dist/
          echo "Squirrel archive created: $ZIP_PATH"

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/
          retention-days: 7
          if-no-files-found: warn

  # Build for Windows (x64 + arm64), unsigned in CI; signing is a local step. arm64 is CROSS-BUILT on the x64 runner, which
  # is how upstream builds it too: build/azure-pipelines/product-build.yml
  # instantiates the same win32 template twice against the same x64 agent pool.
  # Three things make that work and all three are reproduced below.
  #   - `npm_config_arch` selects the TARGET's native node modules at npm ci time.
  #   - `VSCODE_ARCH` and the arch in the gulp task name select the target Electron
  #     and packaging layout.
  #   - Inno Setup only writes `ArchitecturesAllowed=arm64` into the installer
  #     header, so ISCC.exe itself runs fine as an x64 process.
  # No arm64 runner is needed, and none is offered for Windows anyway.
  #
  # One compromise inherited from upstream: the arm64 build ships the same prebuilt
  # build/win32/inno_updater.exe as x64 (build/gulpfile.vscode.win32.ts copies one
  # binary for both arches), so the in-place updater runs under Windows-on-ARM's
  # x64 emulation.
  build-windows:
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    # Pinned: windows-latest now resolves to a VS 2026 image, but build/npm/preinstall.ts
    # only recognizes VS 2022/2019 install paths. windows-2025 still ships VS 2022.
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Belt-and-braces for future image drift: point vs2022_install at whatever VS
      # vswhere finds, so preinstall.ts's toolchain check passes even if the default
      # install path changes again.
      - name: Locate Visual Studio for preinstall toolchain check
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { $vs = & $vswhere -latest -products * -property installationPath }
          if (-not $vs) { Write-Error "vswhere found no Visual Studio installation"; exit 1 }
          Write-Host "Using Visual Studio at: $vs"
          "vs2022_install=$vs" >> $env:GITHUB_ENV

      # As on macOS, root `npm ci` installs the per-extension node_modules via
      # build/npm/dirs.ts, so no separate extension `npm install` steps are needed.
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Picks the TARGET architecture's native modules, so an arm64 build on
          # this x64 runner links arm64 binaries. On the x64 leg this is what the
          # runner would have resolved anyway.
          npm_config_arch: ${{ matrix.arch }}

      # npm never fails an install over an optional dependency, so a skipped
      # per-platform native package is silent. Catch it before packaging rather
      # than shipping a binary-less artifact (see build/npm/checkNativeOptionalDeps.ts).
      - name: Verify native optional dependencies
        run: node build/npm/checkNativeOptionalDeps.ts

      - name: Stamp FlowLeap version
        run: node build/flowleap/stamp-flowleap-version.mjs
        env:
          FLOWLEAP_VERSION: ${{ inputs.version || github.ref_name }}

      # NOTE: deliberately NO "Stamp update configuration" step here, for either
      # arch. ADR 0008 scopes Silent Update rollout to macOS first. The website
      # feed maps `win32-x64` and `win32-arm64`, but updateService.win32.ts
      # actually polls `win32-<arch>-user` for a user setup and
      # `win32-<arch>-archive` for the zip, and NEITHER of those is mapped — so a
      # stamped Windows build would suppress the Notify-Only Checker while its
      # native updater 400s, losing ALL update surfaces. Adding arm64 does not
      # change that: it inherits exactly the x64 situation. Windows stamping
      # arrives with the Windows follow-up.

      # See the macOS job's equivalent step for the full rationale: only the legacy
      # TS FlowLeap extensions need pre-compilation before packaging.
      - name: Compile FlowLeap legacy extensions
        run: |
          npm run gulp compile-extension:pdf-preview
          npm run gulp compile-extension:flowleap
          npm run gulp compile-extension:docx-viewer

      # The win32 package task shells out to bare `signtool.exe` (strips stale
      # Authenticode signatures before rcedit patches version resources). It's
      # installed with the Windows SDK but not on PATH on GitHub-hosted runners.
      - name: Add signtool to PATH
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { Write-Error "signtool.exe not found under Windows Kits"; exit 1 }
          Write-Host "Using signtool at: $($st.FullName)"
          $st.DirectoryName >> $env:GITHUB_PATH

      - name: Build Windows ${{ matrix.arch }}
        run: npm run gulp vscode-win32-${{ matrix.arch }}
        env:
          VSCODE_ARCH: ${{ matrix.arch }}

      - name: Package Windows Build
        shell: pwsh
        run: |
          $version = "${{ inputs.version || github.ref_name }}"

          # Create a zip of the build output
          $buildPath = "..\VSCode-win32-${{ matrix.arch }}"
          if (Test-Path $buildPath) {
            Compress-Archive -Path "$buildPath\*" -DestinationPath "FlowLeap-$version-win32-${{ matrix.arch }}.zip" -Force
          }

      # Build Windows Installer (.exe)
      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Copy Inno Updater Files
        run: npm run gulp vscode-win32-${{ matrix.arch }}-inno-updater

      - name: Build Installers
        continue-on-error: true
        run: |
          npm run gulp vscode-win32-${{ matrix.arch }}-system-setup
          npm run gulp vscode-win32-${{ matrix.arch }}-user-setup

      # Windows artifacts ship UNSIGNED from CI. Signing uses Certum SimplySign, which
      # requires a local desktop app, so it is done after the fact:
      #   build/flowleap/sign-windows-release.ps1  (signs the .exe files and regenerates
      #   their SHA256 hashes) — see docs/release/RELEASE.md for the full procedure.
      - name: Rename Installers
        shell: pwsh
        continue-on-error: true
        run: |
          $version = "${{ inputs.version || github.ref_name }}"
          $arch = "${{ matrix.arch }}"
          if (Test-Path ".build\win32-$arch\system-setup\*.exe") {
            Move-Item ".build\win32-$arch\system-setup\*.exe" "FlowLeap-Setup-$version-$arch.exe" -Force
          }
          if (Test-Path ".build\win32-$arch\user-setup\*.exe") {
            Move-Item ".build\win32-$arch\user-setup\*.exe" "FlowLeap-UserSetup-$version-$arch.exe" -Force
          }

      # The two installer steps above are continue-on-error, so without this the
      # job would go green having produced nothing but the zip. It also proves the
      # cross-build really is a cross-build: the packaged executable's PE machine
      # field is the one thing that would silently stay x64 if npm_config_arch or
      # VSCODE_ARCH stopped taking effect, and a whole arm64 release of x64 binaries
      # is the failure worth catching in CI rather than on a user's machine.
      - name: Verify Windows Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ inputs.version || github.ref_name }}"
          $arch = "${{ matrix.arch }}"

          $expected = @(
            "FlowLeap-$version-win32-$arch.zip",
            "FlowLeap-Setup-$version-$arch.exe",
            "FlowLeap-UserSetup-$version-$arch.exe"
          )
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::Missing expected $arch artifact(s): $($missing -join ', ')"
            Write-Host "Present in the workspace:"
            Get-ChildItem -Path "FlowLeap-*" | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          Get-ChildItem -Path $expected | Select-Object Name, Length | Format-Table -AutoSize

          # PE COFF machine field: 0x8664 = x64, 0xAA64 = ARM64. The offset of the
          # COFF header is the 4-byte little-endian value at 0x3C ('e_lfanew'),
          # then the 4-byte PE signature follows and Machine is the 2 bytes after it.
          $expectedMachine = @{ 'x64' = 0x8664; 'arm64' = 0xAA64 }[$arch]
          # The packaged executable is named after product.nameShort (it is
          # "Flow Leap.exe", with a space) — read it rather than hardcoding it,
          # the same way build/gulpfile.vscode.ts derives it.
          $nameShort = (Get-Content -Raw product.json | ConvertFrom-Json).nameShort
          $exePath = "..\VSCode-win32-$arch\$nameShort.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            Write-Host "::error::Packaged executable not found at $exePath"
            Write-Host "Top-level contents of ..\VSCode-win32-$arch :"
            Get-ChildItem -Path "..\VSCode-win32-$arch" | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $exePath))
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ("$nameShort.exe PE machine: 0x{0:X4} (expected 0x{1:X4} for {2})" -f $machine, $expectedMachine, $arch)
          if ($machine -ne $expectedMachine) {
            Write-Host "::error::$arch build packaged a 0x$('{0:X4}' -f $machine) executable — the cross-build did not take effect."
            exit 1
          }
          # The shipped @img/sharp binary is the one #461 was about: npm installs
          # the HOST's platform package, so before the packaging-time fix this
          # read 0x8664 inside the arm64 build. Checking the executable alone
          # would not have caught it.
          $sharpDir = "..\VSCode-win32-$arch\resources\app\extensions\copilot\node_modules\@img\sharp-win32-$arch"
          $sharpNode = Join-Path $sharpDir "lib\sharp-win32-$arch.node"
          if (-not (Test-Path -LiteralPath $sharpNode)) {
            Write-Host "::error::Target sharp binary not found at $sharpNode — ensureSharpPlatformPackage did not run or packaging dropped it."
            $imgDir = "..\VSCode-win32-$arch\resources\app\extensions\copilot\node_modules\@img"
            if (Test-Path -LiteralPath $imgDir) {
              Write-Host "What is in @img:"
              Get-ChildItem -Path $imgDir | ForEach-Object { Write-Host "  $($_.Name)" }
            }
            exit 1
          }
          $sharpBytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $sharpNode))
          $sharpPeOffset = [System.BitConverter]::ToInt32($sharpBytes, 0x3C)
          $sharpMachine = [System.BitConverter]::ToUInt16($sharpBytes, $sharpPeOffset + 4)
          Write-Host ("sharp-win32-$arch.node PE machine: 0x{0:X4} (expected 0x{1:X4})" -f $sharpMachine, $expectedMachine)
          if ($sharpMachine -ne $expectedMachine) {
            Write-Host "::error::The shipped sharp binary is not $arch."
            exit 1
          }

          Write-Host "OK: $arch artifacts present, and both the executable and the shipped sharp binary are $arch."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            FlowLeap-*.exe
            FlowLeap-*.zip
          retention-days: 7
          if-no-files-found: warn

  # Build for Linux (x64 + arm64) — .deb, .rpm and .tar.gz per arch.
  #
  # Runners: ubuntu-22.04 sets the glibc baseline at 2.35, so the packages
  # install on Ubuntu 22.04 and anything newer, but NOT on Ubuntu 20.04 or
  # RHEL 8. Upstream reaches glibc 2.28 by cross-compiling in a sysroot; we
  # build natively per arch instead, which is far simpler and enough for the
  # distributions we support. `ubuntu-22.04-arm` is a GitHub-hosted arm64
  # runner that is free for PUBLIC repositories only — if this repo ever goes
  # private the arm64 leg fails to schedule and has to move to a cross-build.
  #
  # NOTE: deliberately NO "Stamp update configuration" step, for the same
  # reason as the Windows job — ADR 0008 scopes the native Silent Update to
  # macOS. An unstamped build keeps the Notify-Only Checker as its single
  # update surface.
  build-linux:
    if: ${{ inputs.platforms == '' || inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Three toolchains the packaging tasks shell out to:
      #   pkg-config + libkrb5-dev + libxkbfile-dev — headers for the native
      #     modules npm ci builds (kerberos, native-keymap).
      #   fakeroot — `fakeroot dpkg-deb` in the build-deb task (dpkg-deb itself
      #     is preinstalled).
      #   rpm — rpmbuild for build-rpm, and /usr/lib/rpm/find-requires, which
      #     build/linux/rpm/calculate-deps.ts calls to compute Requires.
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libkrb5-dev libxkbfile-dev fakeroot rpm

      # The packaging stream keeps three near-copies of the ~500 MB app tree
      # (VSCode-linux-*, the deb staging dir and the rpm buildroot). Reclaiming
      # the preinstalled toolchains the build never touches keeps that clear of
      # the disk limit. Paths absent on the arm64 image are simply skipped.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      # As on macOS, root `npm ci` installs the per-extension node_modules via
      # build/npm/dirs.ts, so no separate extension `npm install` steps are needed.
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.arch }}

      # npm never fails an install over an optional dependency, so a skipped
      # per-platform native package is silent. Catch it before packaging rather
      # than shipping a binary-less artifact (see build/npm/checkNativeOptionalDeps.ts).
      - name: Verify native optional dependencies
        run: node build/npm/checkNativeOptionalDeps.ts

      - name: Stamp FlowLeap version
        run: node build/flowleap/stamp-flowleap-version.mjs
        env:
          FLOWLEAP_VERSION: ${{ inputs.version || github.ref_name }}

      # See the macOS job's equivalent step for the full rationale: only the
      # legacy TS FlowLeap extensions need pre-compilation before packaging.
      - name: Compile FlowLeap legacy extensions
        run: |
          npm run gulp compile-extension:pdf-preview
          npm run gulp compile-extension:flowleap
          npm run gulp compile-extension:docx-viewer

      # `-min` is the minified variant, which is what a shipped Linux build
      # wants. It produces ../VSCode-linux-<arch>, the input to every packaging
      # task below.
      - name: Build Linux ${{ matrix.arch }}
        run: npm run gulp vscode-linux-${{ matrix.arch }}-min
        env:
          VSCODE_ARCH: ${{ matrix.arch }}

      # The packaging tasks read specific paths out of this tree (the launcher,
      # chrome-sandbox, chrome_crashpad_handler, bin/, and every native .node),
      # and a missing one surfaces as an opaque dpkg-shlibdeps or find-requires
      # error several steps later. Listing it here makes that diagnosable from
      # the log alone.
      - name: Inspect build output
        run: |
          ls -la "../VSCode-linux-${{ matrix.arch }}" | head -40
          echo "--- bin/ ---"
          ls -la "../VSCode-linux-${{ matrix.arch }}/bin" || true
          echo "--- du ---"
          du -sh "../VSCode-linux-${{ matrix.arch }}"

      # Tar first: the deb and rpm prepare tasks read ../VSCode-linux-<arch> in
      # place, so --transform renames only the archive's top-level directory and
      # leaves the tree alone. --owner/--group=0 so extraction does not carry the
      # runner's uid.
      - name: Create tarball
        run: |
          set -e
          mkdir -p dist
          VERSION="${{ inputs.version || github.ref_name }}"
          tar --owner=0 --group=0 \
            --transform="s,^VSCode-linux-${{ matrix.arch }},FlowLeap-linux-${{ matrix.arch }}," \
            -czf "dist/FlowLeap-$VERSION-linux-${{ matrix.arch }}.tar.gz" \
            -C .. "VSCode-linux-${{ matrix.arch }}"
          ls -la dist/

      # GITHUB_TOKEN is required: build/linux/debian/install-sysroot.ts resolves
      # the Chromium and VS Code sysroots through the GitHub API, and anonymous
      # requests are rate-limited. The sysroots are what dpkg-shlibdeps reads to
      # compute Depends.
      - name: Prepare deb package
        run: npm run gulp vscode-linux-${{ matrix.arch }}-prepare-deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build deb package
        run: |
          set -e
          npm run gulp vscode-linux-${{ matrix.arch }}-build-deb
          VERSION="${{ inputs.version || github.ref_name }}"
          built=$(ls .build/linux/deb/${{ matrix.deb_arch }}/deb/*.deb)
          echo "gulp produced: $built"
          cp "$built" "dist/FlowLeap-$VERSION-linux-${{ matrix.arch }}.deb"

      - name: Prepare rpm package
        run: npm run gulp vscode-linux-${{ matrix.arch }}-prepare-rpm
        env:
          VSCODE_ARCH: ${{ matrix.arch }}

      - name: Build rpm package
        run: |
          set -e
          npm run gulp vscode-linux-${{ matrix.arch }}-build-rpm
          VERSION="${{ inputs.version || github.ref_name }}"
          built=$(ls .build/linux/rpm/${{ matrix.rpm_arch }}/*.rpm)
          echo "gulp produced: $built"
          cp "$built" "dist/FlowLeap-$VERSION-linux-${{ matrix.arch }}.rpm"

      # Assert the branding actually landed rather than eyeballing the log: a
      # package named anything but `flowleap`, built for the wrong arch, or
      # missing flowleap.desktop is a broken release, not a warning.
      - name: Verify packages
        run: |
          set -e
          VERSION="${{ inputs.version || github.ref_name }}"
          DEB="dist/FlowLeap-$VERSION-linux-${{ matrix.arch }}.deb"
          RPM="dist/FlowLeap-$VERSION-linux-${{ matrix.arch }}.rpm"

          # Each listing is taken ONCE into a file and then grepped. Piping a
          # 230 MB `dpkg -c` straight into `grep -q` makes grep exit on the
          # first match, which SIGPIPEs dpkg-deb and prints "tar subprocess
          # returned error exit status 2" into an otherwise passing step.
          control=$(mktemp)
          contents=$(mktemp)
          rpmlist=$(mktemp)
          dpkg -I "$DEB" > "$control"
          dpkg -c "$DEB" > "$contents"
          rpm -qpl "$RPM" > "$rpmlist"

          echo "=== dpkg -I $DEB ==="
          cat "$control"
          grep -qE '^ Package: flowleap$' "$control"
          grep -qE '^ Architecture: ${{ matrix.deb_arch }}$' "$control"

          echo "=== dpkg -c (desktop + icon + bin) ==="
          grep -E 'usr/share/applications/|usr/share/pixmaps/|usr/share/appdata/|usr/share/flowleap/bin/' "$contents"
          grep -q 'usr/share/applications/flowleap\.desktop$' "$contents"
          grep -q 'usr/share/applications/flowleap-url-handler\.desktop$' "$contents"
          grep -q 'usr/share/appdata/flowleap\.appdata\.xml$' "$contents"
          grep -q 'usr/share/pixmaps/flowleap\.png$' "$contents"

          echo "=== rpm -qpi $RPM ==="
          rpm -qpi "$RPM"
          test "$(rpm -qp --queryformat '%{NAME}' "$RPM")" = flowleap
          test "$(rpm -qp --queryformat '%{ARCH}' "$RPM")" = '${{ matrix.rpm_arch }}'
          grep -q '/usr/share/applications/flowleap\.desktop$' "$rpmlist"

          echo "=== tarball top-level ==="
          tar -tzf "dist/FlowLeap-$VERSION-linux-${{ matrix.arch }}.tar.gz" > "$contents"
          head -3 "$contents"
          grep -q '^FlowLeap-linux-${{ matrix.arch }}/$' "$contents"

          echo "=== artifacts ==="
          ls -la dist/

      # The install test is the only step that proves the computed Depends are
      # satisfiable. `apt-get install ./file.deb` resolves them; a plain
      # `dpkg -i` would leave the package unconfigured instead of failing
      # loudly. `flowleap --version` runs the CLI through ELECTRON_RUN_AS_NODE,
      # so it needs no display.
      - name: Install and smoke-test the deb
        run: |
          set -e
          VERSION="${{ inputs.version || github.ref_name }}"
          sudo apt-get install -y "./dist/FlowLeap-$VERSION-linux-${{ matrix.arch }}.deb"
          echo "=== installed files ==="
          dpkg -L flowleap | grep -E 'bin/flowleap|applications/'

          # Regression guard. Upstream's postinst registers Microsoft's apt
          # repository and installs their signing key as a trust anchor; ours
          # deliberately does not, and a careless upstream port would silently
          # restore it. Assert the install touched neither.
          echo "=== no third-party apt source or trust anchor was added ==="
          test ! -e /etc/apt/sources.list.d/vscode.sources
          test ! -e /etc/apt/sources.list.d/vscode.list
          test ! -e /usr/share/keyrings/microsoft.gpg
          ! dpkg -L flowleap | grep -q 'DEBIAN/templates'
          echo "OK: no apt source, no keyring, no debconf question"

          echo "=== flowleap --version ==="
          flowleap --version
          sudo apt-get remove -y flowleap

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Create GitHub Release
  create-release:
    needs: [build-macos, build-windows, build-linux]
    # `dry_run` is empty on a tag push, so `!inputs.dry_run` is true there and
    # the release is drafted as before. A dispatch with dry_run=true stops here,
    # leaving only the uploaded workflow artifacts.
    if: >-
      always()
      && !inputs.dry_run
      && (needs.build-macos.result == 'success'
        || needs.build-windows.result == 'success'
        || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: List Downloaded Artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f 2>/dev/null || echo "No artifacts found"

      # macOS artifacts are final at upload time (signed + notarized + stapled), so these
      # checksums are correct for them. The Windows .exe entries here are for the UNSIGNED
      # builds; after local signing, build/flowleap/sign-windows-release.ps1 regenerates
      # the .exe hashes and the SHASUMS256.txt must be updated on the release (see
      # docs/release/RELEASE.md).
      - name: Generate Checksums
        run: |
          mkdir -p artifacts
          cd artifacts
          find . -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" \) -exec sha256sum {} \; > SHASUMS256.txt 2>/dev/null || echo "No files to checksum" > SHASUMS256.txt
          cat SHASUMS256.txt

      - name: Extract Release Notes from CHANGELOG
        id: release_notes
        run: |
          # Works for both triggers: tag push (ref_name = vX.Y.Z) and manual
          # dispatch (inputs.version). Strip a leading `v` either way.
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION=${VERSION#v}
          echo "Extracting release notes for version $VERSION"

          # Extract the changelog section for this version: print from the line
          # after `## [X.Y.Z]` until the next `## [` header (or EOF). A plain
          # awk range /start/,/end/ can't be used here — the start line itself
          # matches the end pattern, collapsing the range to a single line.
          if [ -f CHANGELOG.md ]; then
            awk "/^## \[$VERSION\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md > release-notes.md
          fi

          # If no changelog entry, create default notes
          if [ ! -s release-notes.md ]; then
            cat > release-notes.md << EOF
          ## FlowLeap Patent IDE ${{ inputs.version || github.ref_name }}

          AI-powered patent analysis IDE based on VS Code.

          ### Downloads
          Download the appropriate package for your platform below.

          ### Installation
          - **macOS**: Download .dmg, open and drag to Applications
          - **Windows**: Download .zip and extract, or use installer .exe
          - **Linux**: Install the .deb (`sudo apt install ./FlowLeap-*.deb`) or the
            .rpm (`sudo dnf install ./FlowLeap-*.rpm`), or extract the .tar.gz and
            run `./FlowLeap-linux-<arch>/flowleap`. Built against glibc 2.35, so
            Ubuntu 22.04+, Debian 12+, Fedora 36+ or equivalent.

          ---
          See full changelog at https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          EOF
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # On tag pushes this is the tag itself; on workflow_dispatch (no tag ref)
          # derive it from the version input so the release step doesn't fail.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          body_path: release-notes.md
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/SHASUMS256.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-Release Summary
        run: |
          echo "Release draft created for ${{ inputs.version || github.ref_name }}"
          echo "  - macOS:   ${{ needs.build-macos.result }} (signed + notarized + stapled)"
          echo "  - Windows: ${{ needs.build-windows.result }} (UNSIGNED)"
          echo "  - Linux:   ${{ needs.build-linux.result }} (unsigned; deb/rpm/tar.gz, glibc 2.35 baseline)"
          echo ""
          echo "Next steps:"
          echo "  1. Sign the Windows .exe files locally with build/flowleap/sign-windows-release.ps1"
          echo "     then re-upload them and refresh SHASUMS256.txt on the release."
          echo "  2. Full procedure: docs/release/RELEASE.md"
          echo "  3. Review and publish the draft at https://github.com/${{ github.repository }}/releases"
