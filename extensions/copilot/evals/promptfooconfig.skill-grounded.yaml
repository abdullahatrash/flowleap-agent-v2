description: "Patent AI — Skill-Grounded (skill content, before registration) (#569)"

# Grades a skill's CONTENT. Each case names a skill folder (`vars.skill`); the provider replays the
# app's skill run — the `skill` tool result (`<skill-context>` block) and a `read_file` result for
# every file the skill lists or links — and the model answers with no further tools. It works on
# skills that `chatSkills` does not register yet, so new skills are measured before they ship
# (PRD 0021 U6). Whether the model PICKS the skill is out of scope (live acceptance run).
#
# Run:  OPENROUTER_API_KEY=sk-... npx tsx scripts/promptfoo.ts eval -c promptfooconfig.skill-grounded.yaml
#       (or `npm run eval:skill-grounded` from extensions/copilot)
# Gate: `npm run eval:skill-grounded:repeat` — 3 runs folded into a k-of-n verdict per case.
#
# Assertion layers: `javascript` predicates in assertions/skill-grounded-assertions.mjs are the
# deterministic layer (no calendar date, exact rule numbers, exact fee amounts) and are proven
# offline by assertions/test/skill-grounded-assertions.spec.ts. The `llm-rubric` layer grades
# completeness against the case's list of required points.

providers:
  - id: file://providers/skill-grounded-provider.ts
    label: "Patent AI (skill-grounded)"

prompts:
  - "{{prompt}}"

defaultTest:
  options:
    # Same judge and explicit max_tokens as the trajectory and key-gate gates — the measured
    # decision recorded in promptfooconfig.trajectory.yaml and README "Judge model decision".
    provider:
      id: openai:chat:google/gemini-2.5-flash
      config:
        apiBaseUrl: https://openrouter.ai/api/v1
        apiKey: "{{env.OPENROUTER_API_KEY}}"
        temperature: 0
        max_tokens: 4096
        passthrough:
          stream: false
  assert:
    # ADR 0013, decision 3: a UPC answer gives the rule, the period and the trigger event — never
    # a calendar date. Applies to every case. A date the user gave in the prompt (for example the
    # service date) may be repeated; any other date fails.
    - type: javascript
      value: |
        return import('node:url')
          .then(u => import(u.pathToFileURL(process.cwd() + '/assertions/skill-grounded-assertions.mjs').href))
          .then(H => {
            const dates = H.findCalendarDates(H.answerText(output), context.vars.prompt);
            return { pass: dates.length === 0, score: dates.length === 0 ? 1 : 0, reason: dates.length === 0 ? 'No calendar date' : `Calendar date(s) in the answer: ${dates.join('; ')}` };
          });
      metric: no_calendar_date

tests:
  - file://datasets/skill-grounded/skill-grounded-cases.yaml

outputPath: output/skill-grounded-latest.json
