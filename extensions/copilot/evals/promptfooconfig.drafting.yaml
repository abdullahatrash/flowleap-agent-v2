description: "Patent AI — Application Drafting regression (outline and draft cases, PRD 0022 E4)"

# Judge pinned 2026-10-12: anthropic/claude-haiku-5.5 (same vendor as the subject Sonnet 5; the
# judge's only task is grounding — list technical sentences absent from the sources — so
# self-preference risk is low; the other six suites keep google/gemini-2.5-flash until
# re-baselined). OpenRouter price on 2026-10-12: $0.10 / 1M input, $0.50 / 1M output tokens.

# Grades the application-drafting skill on three invented matters (mechanical, software, chemistry),
# each for the US and the EPO. Two single-turn case kinds (datasets/drafting/drafting-cases.yaml):
#   O1–O6  inputs → Draft Outline;            graded by checkOutline (outline_coverage)
#   D1–D6  inputs + fixed outline → draft;    graded by validateDraft and four code checks, plus ONE
#                                             judge for unsupported technical additions
# The graders import the app's validators (src/extension/tools/common/drafting) through
# assertions/drafting-assertions.ts, so the eval grades with the rules the app runs.
#
# Run:  OPENROUTER_API_KEY=sk-... npm run eval:drafting -- --no-cache       (a probe)
# Gate: OPENROUTER_API_KEY=sk-... npm run eval:drafting:repeat              (3 runs, k-of-n per case)
# Pre-outline baseline (draft cases only, the skill as it was before the outline):
#       EVAL_SKILLS_DIR=<exported skills dir> npm run eval:drafting:repeat -- \
#         --output-prefix drafting-pre-outline -- --filter-pattern '^D\d'
# See README "Drafting suite".

providers:
  - id: file://providers/skill-grounded-provider.ts
    label: "Patent AI (application-drafting skill)"
    config:
      # The answer budget includes the model's reasoning: on claude-sonnet-5 a draft of a small
      # matter is ~4k tokens of text after ~10k reasoning tokens (measured 2026-10-12). With 12000
      # the first probe came back empty; 32000 leaves room without truncation.
      maxTokens: 32000

prompts:
  - id: file://datasets/drafting/drafting-matters.ts
    label: drafting-case

defaultTest:
  options:
    # The judge (see the header). Haiku 5.5 rejects non-default sampling values (temperature,
    # top_p, top_k) with a 400, and thinking is adaptive and on by default. `omitDefaults` stops
    # promptfoo's OpenAI provider from sending its default temperature 0; max_tokens is explicit.
    provider:
      id: openai:chat:anthropic/claude-haiku-5.5
      config:
        apiBaseUrl: https://openrouter.ai/api/v1
        apiKey: "{{env.OPENROUTER_API_KEY}}"
        omitDefaults: true
        max_tokens: 4096
        passthrough:
          stream: false

tests:
  - file://datasets/drafting/drafting-cases.yaml

outputPath: output/drafting-latest.json
