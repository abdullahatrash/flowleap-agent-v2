# Skill-grounded cases (#569, PRD 0021 U6).
#
# Each case names the skill folder to load (`vars.skill`, a folder under assets/skills) and the
# user's question (`vars.prompt`). The provider puts the skill into context the way the app does
# and returns `{ skill, loadedFiles, finalText }`; read the answer with `H.answerText(output)`.
#
# Every case gets the suite-wide `no_calendar_date` check (promptfooconfig.skill-grounded.yaml).
# Add the checks the case needs:
#
#   Exact rule numbers — fails and names each rule the answer does not cite (R.23, Rule 23, RoP 23):
#     - type: javascript
#       value: |
#         return import('node:url')
#           .then(u => import(u.pathToFileURL(process.cwd() + '/assertions/skill-grounded-assertions.mjs').href))
#           .then(H => { const missing = H.missingRules(H.answerText(output), ['23', '19.1']);
#             return { pass: missing.length === 0, score: missing.length === 0 ? 1 : 0, reason: missing.length === 0 ? 'All rules cited' : `Rules not cited: ${missing.join(', ')}` }; });
#       metric: <case>_rules
#
#   Exact fee amounts (whole euros, from the official 2026 table) — same shape with
#     H.missingFees(H.answerText(output), [11000, 200])
#
#   Completeness — an llm-rubric that lists the points the answer must cover. Give it
#     `transform: JSON.parse(output).finalText` so the judge reads the answer, not the JSON.

# ── S1 — smoke: an existing UPC skill, loaded with its reference file. ──
- description: "S1 — smoke: infringement forum and language for a unitary patent (upc-division-router)"
  vars:
    skill: upc-division-router
    prompt: "We act for the patentee of a European patent with unitary effect, granted in English. The infringer is a company seated in Milan that sells the infringing product in Germany and the Netherlands. Where can we bring the infringement action at the UPC, and in which language? If the defendant counterclaims for revocation, what can the division do with it?"
  assert:
    - type: javascript
      value: JSON.parse(output).loadedFiles.includes('references/divisions.md');
      metric: s1_reference_loaded
    - type: llm-rubric
      transform: JSON.parse(output).finalText
      value: |
        The answer is about where a UPC infringement action can be brought and in which language. It is
        complete only if it covers ALL of these points:
        1. The action goes to a local or regional division, not the central division.
        2. Eligible divisions include a division for the place of infringement (a German local division
           and/or The Hague local division) AND the division for the defendant's seat (the Milan local
           division); the claimant chooses between them.
        3. The language depends on the division chosen (for example German or English at a German local
           division), and English is available in the eligible divisions.
        4. For the revocation counterclaim, the division may keep it and hear both, refer the revocation to
           the central division (bifurcation), or refer the whole case with the parties' agreement.
        Fail if any point is missing or contradicted. Do not grade style or length.
      metric: s1_complete

# ── S5 — PRD 0021 scenario 5: a new representative asks how to register. ──
- description: "S5 — new representative: entitlement, registration, rejection and review (upc-representative-start)"
  vars:
    skill: upc-representative-start
    prompt: "I am a European Patent Attorney. I do not have the European Patent Litigation Certificate, but I hold a master's degree in law from a German university. Can I represent clients at the UPC, and how do I register as a representative in the court's filing system? What can I do if the Registrar rejects my request? In our firm a trainee drafts the filings and the office manager pays the fees: do they need to register too?"
  assert:
    - type: javascript
      value: |
        const loaded = JSON.parse(output).loadedFiles;
        const pass = loaded.includes('references/registration.md');
        return { pass, score: pass ? 1 : 0, reason: pass ? 'Reference file loaded' : `Reference file not loaded: ${JSON.stringify(loaded)}` };
      metric: s5_reference_loaded
    - type: javascript
      value: |
        return import('node:url')
          .then(u => import(u.pathToFileURL(process.cwd() + '/assertions/skill-grounded-assertions.mjs').href))
          .then(H => {
            const text = H.answerText(output);
            const missing = H.missingRules(text, ['11', '18']);
            if (!/Art(?:icle|\.)?\s?48\s?\(2\)/i.test(text)) { missing.push('Art. 48(2) UPCA'); }
            return { pass: missing.length === 0, score: missing.length === 0 ? 1 : 0, reason: missing.length === 0 ? 'Legal basis cited' : `Not cited: ${missing.join(', ')}` };
          });
      metric: s5_rules
    - type: llm-rubric
      transform: JSON.parse(output).finalText
      value: |
        The answer tells a European Patent Attorney without the European Patent Litigation Certificate, who holds a
        master's degree in law from an EU Member State, whether and how they can register as a UPC representative.
        It is complete only if it covers ALL of these points:
        1. A European Patent Attorney may represent under Art. 48(2) UPCA only with appropriate qualifications, and a
           bachelor's or master's degree in law from an EU Member State is such a qualification (Rule 11 of the EPLC
           Rules), so the user can apply for registration on the list of entitled representatives.
        2. Registration is a request to the Registrar, made from the user's own account in the court's filing
           system: the user selects the entitlement and attaches a copy of the diploma as evidence.
        3. The Registrar examines the request: it enters the person on the list, or invites the person to correct a
           deficiency (a non-extendable period of two months), or rejects the request.
        4. Against a rejection the person can file a petition for review with the Registrar within one month of
           notification of the decision, with the reasons (Rule 18 of the EPLC Rules); if the Registrar does not
           rectify the decision, the President of the Court of Appeal decides.
        5. The trainee who drafts and the office manager who pays do not need to register as representatives, but
           a court filing must be signed by a registered representative.
        Fail if any point is missing or contradicted. Do not grade style or length.
      metric: s5_complete
