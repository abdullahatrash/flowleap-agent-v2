- description: D1 cable-clamp US draft
  vars:
    <<: *cableClamp
    kind: draft
  assert: &draftAsserts
    - type: javascript
      metric: draft_validators
      value: |
        return import('node:url')
          .then(u => import(u.pathToFileURL(process.cwd() + '/assertions/drafting-assertions.ts').href))
          .then(H => H.gradeDraftValidators(output, context.vars));
    - type: javascript
      metric: draft_missing_support
      value: |
        return import('node:url')
          .then(u => import(u.pathToFileURL(process.cwd() + '/assertions/drafting-assertions.ts').href))
          .then(H => H.gradeMissingSupport(output, context.vars));
    - type: javascript
      metric: draft_prophetic
      value: |
        return import('node:url')
          .then(u => import(u.pathToFileURL(process.cwd() + '/assertions/drafting-assertions.ts').href))
          .then(H => H.gradeProphetic(output, context.vars));
    - type: javascript
      metric: draft_sections
      value: |
        return import('node:url')
          .then(u => import(u.pathToFileURL(process.cwd() + '/assertions/drafting-assertions.ts').href))
          .then(H => H.gradeSections(output, context.vars));
    # The one judge (PRD 0022 decision 2: factual accuracy = unsupported technical additions).
    # Style is not graded; elaboration and diversity are not measured, by decision.
    - type: llm-rubric
      metric: draft_unsupported
      # The judge reads the sources of the matter and the draft (judgeInput), not the JSON.
      transform: |
        return import('node:url')
          .then(u => import(u.pathToFileURL(process.cwd() + '/assertions/drafting-assertions.ts').href))
          .then(H => H.judgeInput(output, context.vars));
      value: |
        The output has two parts: SOURCES (the Feature List, the disclosure, the figures and the Approved Claims of a patent matter) and DRAFT DESCRIPTION (the description of a patent application written from them, one block per paragraph, each headed with its section and the sources it cites; its claims and Inventor Questions are left out). The sources are the only basis of technical fact.

        Find the unsupported technical additions. An addition is a sentence that brings in something the SOURCES do not have: a part, material, value, dimension, step, mechanism, purpose, effect or result that appears nowhere in the SOURCES.
        - Check each sentence against the sources its paragraph cites, then against all the SOURCES. A fact found anywhere in the SOURCES is not an addition, also when the paragraph cites another source.
        - Not additions: the same fact in other words ("formed in one piece" = "made in one piece"); a summary, a combination or the plain converse of source facts; a sentence that restates a claim of the APPROVED CLAIMS, even when the Feature List lacks it; framing words around source facts ("the technical problem is", "the invention solves", "advantageously"); a figure description that matches the figures file; boilerplate with no technical content (scope statements, "in some embodiments", the meaning of "comprising"); a statement that a fact is not known or is asked as an Inventor Question.
        - Do not judge style, length, wording or which source a paragraph cites.
        - Before you list a sentence, name to yourself the new thing it brings in. When you cannot name one that is absent from all the SOURCES, do not list the sentence.

        Your reason is only a JSON array of the unsupported sentences, each quoted word for word as a string, and [] when there is none: no scores, no other text, no opinion on style. Pass exactly when the array is empty.

- description: D2 cable-clamp EPO draft
  vars:
    <<: *cableClamp
    office: EPO
    kind: draft
  assert: *draftAsserts

