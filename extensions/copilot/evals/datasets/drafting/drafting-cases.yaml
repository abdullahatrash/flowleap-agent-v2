# Drafting regression cases (PRD 0022 E4, #632). Three invented matters x two offices x two kinds.
#
# Guardrail: every fixture under fixtures/ is invented for this eval. No HUPD, no Google Patents,
# no text of a real patent.
#
# Each matter has one deliberate gap and one prophetic example:
#   gapTerm            a claim term with no Feature List row and no disclosure span. The fixed
#                      outline plans it as a Technical item with only a Question; the draft must
#                      ask it as an Inventor Question and state no fact about it.
#   propheticSources   the markers of the prophetic example (not run): no result in past tense.
#   workingSources     the markers of the working example (run): left out of the prophetic check.
#
# Kinds: `outline` (O cases) asks for the Draft Outline; `draft` (D cases) gives the fixed
# outline (fixtures/<matter>/draft-outline-<office>.md) and asks for the Draft Application.
# The prompt is built by drafting-matters.ts from the fixture files; the judge reads the same files
# (judgeInput in assertions/drafting-assertions.ts).
#
# Graders (assertions/drafting-assertions.ts unless noted), one metric each:
#   outline_coverage       checkOutline: no outline-format, outline-coverage or outline-sources Error
#   draft_validators       validateDraft (D1) with the fixed outline (E1): no Error (open Inventor
#                          Questions and the literal-basis Error of the gap term are expected)
#   draft_unsupported      llm-rubric (judge anthropic/claude-haiku-5.5): the JSON array of technical
#                          sentences absent from the sources is empty
#   draft_missing_support  the gap term is an Inventor Question and no sourced paragraph states it
#   draft_prophetic        the prophetic example states no result in past tense
#   draft_sections         every required section of the office order is present
# Numerals outside figures.md and a defined term used two ways are D1 Errors (draft_validators).

- description: O1 cable-clamp US outline
  vars: &cableClamp
    skill: application-drafting
    matter: cable-clamp
    office: US
    kind: outline
    gapTerm: damping insert
    propheticSources: feature:F7, disclosure:§4.2
    workingSources: feature:F6, disclosure:§4.1
  assert: &outlineAsserts
    - type: javascript
      metric: outline_coverage
      value: |
        return import('node:url')
          .then(u => import(u.pathToFileURL(process.cwd() + '/assertions/drafting-assertions.ts').href))
          .then(H => H.gradeOutline(output, context.vars));

- description: O2 cable-clamp EPO outline
  vars:
    <<: *cableClamp
    office: EPO
  assert: *outlineAsserts

- description: O3 sync-scheduler US outline
  vars: &syncScheduler
    skill: application-drafting
    matter: sync-scheduler
    office: US
    kind: outline
    gapTerm: session key
    propheticSources: feature:F7, disclosure:§4.2
    workingSources: feature:F6, disclosure:§4.1
  assert: *outlineAsserts

- description: O4 sync-scheduler EPO outline
