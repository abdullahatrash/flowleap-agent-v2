# Filing-Fee Arithmetic Tests
# Exercises the excess-claims threshold arithmetic surfaced by the
# excess-claims-estimator skill: claims above the office threshold incur a
# per-claim surcharge (EPO over 15, USPTO over 20 total / 3 independent).
# No fee tool exists, so the model answers in text — assertions check the
# computed excess COUNTS (not currency amounts, which drift and must be
# verified against the current schedule).
#
# NOTE: a fresh case has no cached provider response, so grading it requires a
# paid model run (it cannot be re-graded assert-only). Committed as the eval
# example for excess-claims arithmetic; run against a configured provider to grade.

- vars:
    prompt: >
      My draft application has 22 claims, 4 of them independent. How many claims
      incur excess-claim surcharges if I file at the EPO, and how many at the
      USPTO? Just the counts — I'll verify the amounts against the current fee
      schedule myself.
  assert:
    # EPO charges each claim above 15 → 22 − 15 = 7.
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const text = (parsed.text || '') + JSON.stringify(parsed.tool_calls || []);
        return /\b7\b/.test(text);
      metric: excess_claims_epo_count_seven
    # USPTO charges each claim over 20 total → 22 − 20 = 2 (plus 1 excess independent: 4 − 3).
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const text = (parsed.text || '') + JSON.stringify(parsed.tool_calls || []);
        return /\b2\b/.test(text);
      metric: excess_claims_uspto_total_count_two
    # Must not fabricate a specific currency amount as if authoritative — amounts
    # drift and the skill requires a "verify against the current schedule" caveat.
    - type: llm-rubric
      value: >
        The response gives the excess-claim COUNTS (7 for the EPO over the
        15-claim threshold; 2 for the USPTO over the 20-claim total threshold)
        and does NOT state a definite current fee amount without a caveat that
        the official fee schedule governs and amounts must be verified.
      metric: excess_claims_caveats_amounts
