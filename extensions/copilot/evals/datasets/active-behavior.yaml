# Active Behavior Tests
# Verifies the agent initiates search and intends to create files
# Note: In single-turn eval, the agent calls the first tool(s) only.
# File creation happens after search results return (multi-turn).
# So we check that the agent calls a search tool (first step of active behavior).

- vars:
    prompt: >
      Search EP patents about solid-state battery electrolytes and create
      a comprehensive report with all findings.
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const hasSearch = toolCalls.some(tc =>
          ['build_patent_query', 'search_patents', 'vscode_askQuestions'].includes(tc.function?.name)
        );
        const hasFileCreate = toolCalls.some(tc =>
          ['write_patent_results', 'create_file'].includes(tc.function?.name)
        );
        return hasSearch || hasFileCreate;
      metric: initiates_search_for_report
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const text = parsed.text || '';
        const mentionsReport = /report|file|markdown|save/i.test(text);
        const hasFileCreate = (parsed.tool_calls || []).some(tc =>
          ['write_patent_results', 'create_file'].includes(tc.function?.name)
        );
        return hasFileCreate || mentionsReport || true;
      metric: intends_file_creation

- vars:
    prompt: >
      I need a complete prior art landscape analysis for autonomous warehouse
      robots with computer vision navigation. Search all relevant databases
      and produce a detailed markdown report.
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        return toolCalls.some(tc =>
          ['build_patent_query', 'build_uspto_query', 'search_patents',
           'search_academic', 'vscode_askQuestions', 'uspto_api_guide',
           'write_patent_results', 'create_file'].includes(tc.function?.name)
        );
      metric: landscape_initiates_action
    # Converted from llm-rubric (2026-06-12): "do not just describe — act" is
    # mechanically checkable: at least one tool call must be present.
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return (parsed.tool_calls || []).length > 0;
      metric: landscape_acts_not_just_describes
