        const parsed = JSON.parse(output);
        return (parsed.tool_calls || []).some(tc => tc.function?.name === 'vscode_askQuestions');
      metric: company_name_still_asks_jurisdiction
    # Converted from llm-rubric (2026-06-12): "do not infer jurisdiction from the
    # company name" is mechanically checkable — no search tool may run before the ask.
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const searchTools = ['search_patents', 'uspto_api_guide', 'patent_api_request'];
        const askIdx = toolCalls.findIndex(tc => tc.function?.name === 'vscode_askQuestions');
        const searchIdx = toolCalls.findIndex(tc => searchTools.includes(tc.function?.name));
        return askIdx >= 0 && (searchIdx < 0 || askIdx < searchIdx);
      metric: company_name_asks_before_any_search

- vars:
