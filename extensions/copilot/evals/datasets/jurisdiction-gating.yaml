        const parsed = JSON.parse(output);
        return !(parsed.tool_calls || []).some(tc => tc.function?.name === 'vscode_askQuestions');
      metric: explicit_us_skips_ask
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return (parsed.tool_calls || []).some(tc =>
          tc.function?.name === 'uspto_api_guide' || tc.function?.name === 'build_uspto_query'
