- vars:
    prompt: "Find prior art for my claim: a drone with obstacle avoidance using lidar"
  assert:
    - type: javascript
      value: |
        // H5 softened gate: a prior-art task with no explicit jurisdiction may
        // EITHER ask via the carousel OR default to Both (comprehensive) and
        // proceed — but proceeding is only compliant when the turn shows BOTH
        // office paths (EP: search_patents; US: uspto_api_guide/patent_api_request).
        // (Aligned with tool-selection's H5 update; sonnet-5 follows the rule
        // literally where gemini asked anyway.)
        const parsed = JSON.parse(output);
        const names = (parsed.tool_calls || []).map(tc => tc.function?.name);
        const asked = names.includes('vscode_askQuestions');
        const ep = names.includes('search_patents');
        const us = names.includes('uspto_api_guide') || names.includes('patent_api_request');
        return asked || (ep && us);
      metric: claim_without_jurisdiction_asks_or_comprehensive

- vars:
    prompt: "Is my idea patentable? A toothbrush that detects cavities with ultrasound"
  assert:
    - type: javascript
      value: |
        // Same H5 rule as above: ask, or proceed comprehensively on both paths.
        const parsed = JSON.parse(output);
        const names = (parsed.tool_calls || []).map(tc => tc.function?.name);
        const asked = names.includes('vscode_askQuestions');
        const ep = names.includes('search_patents');
        const us = names.includes('uspto_api_guide') || names.includes('patent_api_request');
        return asked || (ep && us);
      metric: own_invention_asks_or_comprehensive

# Mixed jurisdictions explicitly named — must not ask, must search
- vars:
    prompt: "Compare US and European patents on perovskite solar cells"
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return !(parsed.tool_calls || []).some(tc => tc.function?.name === 'vscode_askQuestions');
      metric: mixed_jurisdictions_skip_ask
    - type: javascript
      value: |
        // Outcome over path: "compare US and European patents on X" is validly
        // answered either by searching both offices or by a corpus-level
        // patent_analytics_viz comparison — but the analytics route only counts
        // when its calls actually cover BOTH jurisdictions.
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const firstTool = toolCalls[0]?.function?.name;
        if (['search_patents', 'uspto_api_guide'].includes(firstTool)) return true;
        if (firstTool !== 'patent_analytics_viz') return false;
        const countries = toolCalls
          .filter(tc => tc.function?.name === 'patent_analytics_viz')
          .map(tc => { try { return JSON.parse(tc.function.arguments).countryCode; } catch { return undefined; } });
        return countries.includes('US') && countries.includes('EP');
      metric: mixed_jurisdictions_first_tool_is_search

# "all patent offices" Both-scope synonym — must not ask
- vars:
    prompt: "Search all patent offices for graphene battery anodes"
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return !(parsed.tool_calls || []).some(tc => tc.function?.name === 'vscode_askQuestions');
      metric: all_offices_synonym_skips_ask
