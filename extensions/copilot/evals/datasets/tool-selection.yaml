# Tool Selection Tests - Paths A through L from the decision tree
# Verifies the agent selects the correct first tool for each query type

- vars:
    prompt: >
      Here is my claim: "A method for wirelessly charging a mobile device using
      resonant inductive coupling between a transmitter coil and a receiver coil,
      wherein the transmitter adjusts its operating frequency based on real-time
      impedance measurements." Find prior art for this claim.
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'vscode_askQuestions';
      metric: path_a_claim_prior_art
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'build_patent_query');
        if (!call) return true; // ask-first flow: build_patent_query is not expected in single-turn output
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const d = String(args.description || args.query || '').toLowerCase();
        return d.includes('wireless') || d.includes('inductive') || d.includes('charging') || d.includes('impedance');
      metric: path_a_claim_args_contain_technical_terms
    # Converted from llm-rubric (2026-06-12): ask-before-search ordering and
    # no fabricated patent numbers are both mechanically checkable.
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const searchTools = ['build_patent_query', 'search_patents', 'uspto_api_guide', 'build_uspto_query'];
        const askIdx = toolCalls.findIndex(tc => tc.function?.name === 'vscode_askQuestions');
        const searchIdx = toolCalls.findIndex(tc => searchTools.includes(tc.function?.name));
        const asksBeforeSearch = askIdx >= 0 && (searchIdx < 0 || askIdx < searchIdx);
        const text = parsed.text || '';
        const noFabricatedNumbers = !/\b(?:US|EP|WO)\s?\d{6,}/i.test(text);
        return asksBeforeSearch && noFabricatedNumbers;
      metric: path_a_asks_before_search_no_fabricated_numbers

