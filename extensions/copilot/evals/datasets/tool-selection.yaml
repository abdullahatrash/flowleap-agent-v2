        return String(args.citedDocument || '').includes('10123456');
      metric: forward_citations_args_carry_document

# --- #101 PROMPT-ALIGNMENT BRANCHES ---
# These assert the routing that patentAIPrompt.tsx now teaches explicitly
# (analytics branch C, claim-analysis in A/D, one-shot details branch F, figures
# branch G) rather than relying on tool modelDescriptions alone.

# Branch C: landscape/analytics wording must route to patent_analytics_viz and
# must NOT trip the query builder (the prompt and tool both say "DO NOT use
# build_patent_query for analytics").
- vars:
    prompt: >
      Give me the patent landscape for solid-state battery technology — who are
      the top assignees and how have filings trended over the past decade?
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'patent_analytics_viz';
      metric: landscape_routes_to_analytics_viz
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return !(parsed.tool_calls || []).some(tc => tc.function?.name === 'build_patent_query');
      metric: landscape_does_not_call_query_builder

# Branch A/D claim analysis: a pasted claim asked for structural breakdown routes
# through analyze_claim first, before any search and without the jurisdiction gate.
- vars:
    prompt: >
      Here's claim 1 of my draft application: "A wearable device comprising a
      photoplethysmography sensor, a processor configured to derive a heart-rate
      variability metric, and a haptic actuator triggered when the metric crosses
      a threshold." Break it into its individual elements and pull out the key
      technical keywords.
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'analyze_claim';
      metric: pasted_claim_routes_to_analyze_claim_first
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const asked = toolCalls.some(tc => tc.function?.name === 'vscode_askQuestions');
        const searched = toolCalls.some(tc => ['build_patent_query', 'search_patents', 'build_uspto_query'].includes(tc.function?.name));
        return !asked && !searched;
      metric: pasted_claim_analysis_skips_gate_and_search

