# Tool Selection Tests - Paths A through L from the decision tree
# Verifies the agent selects the correct first tool for each query type

- vars:
    prompt: >
      Here is my claim: "A method for wirelessly charging a mobile device using
      resonant inductive coupling between a transmitter coil and a receiver coil,
      wherein the transmitter adjusts its operating frequency based on real-time
      impedance measurements." Find prior art for this claim.
  assert:
    - type: javascript
      value: |
        // Branch A has two prompt-sanctioned openers: clarify jurisdiction via the
        // carousel, OR go straight to search_patents — the model analyzes the
        // claim in its own reasoning/text (there is no claim-analysis tool),
        // writes the CQL itself and searches. H5's softened jurisdiction gate
        // (2026-07-17) lets a prior-art task — which a supplied claim plainly is —
        // default to comprehensive coverage and PROCEED without asking, so requiring
        // vscode_askQuestions first is now stale.
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'vscode_askQuestions' || firstTool === 'search_patents';
      metric: path_a_claim_prior_art
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'search_patents');
        if (!call) return true; // ask-first flow: search_patents is not expected in single-turn output
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        // Model-written CQL: terms may appear as ta=term or inside ta="a phrase",
        // so a plain substring check on the lowercased query string suffices.
        const q = String(args.query || '').toLowerCase();
        return q.includes('wireless') || q.includes('inductive') || q.includes('charging') || q.includes('impedance');
      metric: path_a_claim_args_contain_technical_terms
    # Converted from llm-rubric (2026-06-12); relaxed 2026-07-17 for H5's softened
    # gate. Guards the real invariants: no fabricated patent numbers, and a
    # prompt-sanctioned Branch A opener — the jurisdiction carousel or a direct
    # search_patents call with model-written CQL (claim decomposition happens in
    # the model's own text, not via a tool; see path_a_claim_prior_art).
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const firstTool = toolCalls[0]?.function?.name;
        const validOpener = firstTool === 'vscode_askQuestions' || firstTool === 'search_patents';
        const text = parsed.text || '';
        const noFabricatedNumbers = !/\b(?:US|EP|WO)\s?\d{6,}/i.test(text);
        return validOpener && noFabricatedNumbers;
      metric: path_a_valid_opener_no_fabricated_numbers

