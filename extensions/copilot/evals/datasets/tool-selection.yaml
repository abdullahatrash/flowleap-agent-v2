# --- NEW-TOOL COVERAGE (task #5) ---
# The typed tools added post-migration (analyze_claim, compare_claims,
# get_patent_details, get_patent_figures, patent_analytics_viz) and
# search_forward_citations had no dataset coverage. patentAIPrompt.tsx does NOT
# name the first five in its decision tree, so their routing is driven by the
# tool modelDescriptions; prompts below are phrased to hit those descriptions
# without tripping branch A's prior-art path or the jurisdiction gate.

# analyze_claim: structural element extraction (NOT a prior-art search, so no
# jurisdiction gate and no build_patent_query). Trigger: analyze_claim
# modelDescription "extract searchable elements ... claim element breakdown".
- vars:
    prompt: >
      Here's claim 1 of my draft application. Extract the individual claim
      elements and technical keywords so I understand its structure — don't
      search anything yet: "A system comprising a lidar sensor, a processor
      configured to detect obstacles, and an actuator that adjusts a flight path."
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'analyze_claim';
      metric: analyze_claim_first_for_element_extraction
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'analyze_claim');
        if (!call) return false;
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const t = String(args.claimText || '').toLowerCase();
        return t.includes('lidar') || t.includes('obstacle') || t.includes('flight');
      metric: analyze_claim_args_carry_claim_text

# compare_claims: user supplies their claim AND explicit patent numbers to
# compare against (no search needed). Trigger: compare_claims modelDescription.
- vars:
    prompt: >
      Compare my claim against these existing patents to find overlaps. My claim:
      "A battery pack with a liquid cooling channel integrated into the cell
      housing." Compare it against US-7654321-B2 and EP-1234567-A1.
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'compare_claims';
      metric: compare_claims_first_for_claim_vs_patents
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'compare_claims');
        if (!call) return false;
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const blob = JSON.stringify(args).toLowerCase();
        return blob.includes('7654321') && (blob.includes('cooling') || blob.includes('battery'));
      metric: compare_claims_args_carry_patents_and_claim

# get_patent_details: full document (biblio + claims + description) of a specific
# patent. Branch F now PREFERS get_patent_details; ops_api_guide is the
# equivalent, so accept either. Must NOT open the jurisdiction gate or search.
- vars:
    prompt: >
      I want the complete patent document for EP2000000 — bibliographic data,
      abstract, all claims, and the full description.
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'get_patent_details' || firstTool === 'ops_api_guide';
      metric: get_patent_details_routes_to_detail_path
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const asked = toolCalls.some(tc => tc.function?.name === 'vscode_askQuestions');
        const searched = toolCalls.some(tc => ['build_patent_query', 'search_patents', 'build_uspto_query'].includes(tc.function?.name));
        return !asked && !searched;
      metric: get_patent_details_skips_gate_and_search

