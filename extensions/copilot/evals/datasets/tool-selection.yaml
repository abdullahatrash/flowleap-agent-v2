      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'get_register_events';
      metric: register_events_question_routes_to_get_register_events_first

# --- #106 COMPOUND-TOOL BRANCHES (summary / term / compare_patents) ---

# Branch F expiry: "when does <patent> expire" routes to the dedicated
# get_patent_term tool, not the general summary/details path.
- vars:
    prompt: "When does patent EP1234567 expire?"
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'get_patent_term';
      metric: expiry_question_routes_to_get_patent_term_first
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return !(parsed.tool_calls || []).some(tc => tc.function?.name === 'vscode_askQuestions');
      metric: expiry_question_skips_jurisdiction_gate

# Branch E compare_patents: comparing TWO PUBLISHED documents to each other is
# compare_patents, NOT compare_claims (which charts a user's OWN drafted claim
# text). No jurisdiction gate, no search first.
- vars:
    prompt: "What are the differences between patents US10123456 and EP1000000?"
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'compare_patents';
      metric: compare_published_patents_routes_to_compare_patents_first
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return !(parsed.tool_calls || []).some(tc => tc.function?.name === 'compare_claims');
      metric: compare_patents_not_confused_with_compare_claims
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'compare_patents');
        if (!call) return false;
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const blob = JSON.stringify(args);
        return blob.includes('10123456') && blob.includes('EP1000000');
      metric: compare_patents_args_carry_both_numbers
