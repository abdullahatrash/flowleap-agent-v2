# --- #101 PROMPT-ALIGNMENT BRANCHES ---
# These assert the routing that patentAIPrompt.tsx now teaches explicitly
# (analytics branch C, claim-analysis in A/D, one-shot details branch F, figures
# branch G) rather than relying on tool modelDescriptions alone.

# Branch C: landscape/analytics wording must route to patent_analytics_viz and
# must NOT run a document search (branch C1: "do NOT run a document search
# first" — no search_patents call for an analytics deliverable).
- vars:
    prompt: >
      Give me the patent landscape for solid-state battery technology — who are
      the top assignees and how have filings trended over the past decade?
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'patent_analytics_viz';
      metric: landscape_routes_to_analytics_viz
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return !(parsed.tool_calls || []).some(tc => tc.function?.name === 'search_patents');
      metric: landscape_does_not_run_document_search

# Branch A/D claim analysis: a pasted claim asked for structural breakdown is
# decomposed in the model's OWN text — there is no claim-analysis tool — with
# no search calls and without the jurisdiction gate.
- vars:
    prompt: >
      Here's claim 1 of my draft application: "A wearable device comprising a
      photoplethysmography sensor, a processor configured to derive a heart-rate
      variability metric, and a haptic actuator triggered when the metric crosses
      a threshold." Break it into its individual elements and pull out the key
      technical keywords.
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const t = String(parsed.text || '').toLowerCase();
        return t.includes('photoplethysmography') || t.includes('heart-rate') || t.includes('heart rate') || t.includes('haptic');
      metric: pasted_claim_decomposed_in_text
    - type: javascript
      value: |
        // The hard invariant is NO SEARCH without jurisdiction — an optional
        // forward-looking vscode_askQuestions after the in-text decomposition
        // is fine (the gate-eager prompt makes the model offer the next step).
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const searched = toolCalls.some(tc => ['search_patents', 'uspto_api_guide', 'patent_api_request'].includes(tc.function?.name));
        return !searched;
      metric: pasted_claim_analysis_runs_no_search

# Branch F: "tell me about <patent>" now prefers the one-call get_patent_summary
# overview tool. This REPLACES the prior expectation that get_patent_details was
# first for overview questions (#106): summary is the DEFAULT entry point for a
# single-patent overview (biblio + abstract + status + family + term in one call),
# and get_patent_details is reserved for the FULL claims/description text.
- vars:
    prompt: "Tell me about patent EP3000000 — give me an overview of what it is and its status."
