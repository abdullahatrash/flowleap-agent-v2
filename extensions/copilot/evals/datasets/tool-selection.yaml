# search_forward_citations: who-cites-this / impact analysis. Branch I names it
# PRIMARY for who-cites (input: citedDocument); not jurisdiction-gated.
- vars:
    prompt: "Who cites US10123456, and how impactful is it as prior art?"
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const firstTool = (parsed.tool_calls || [])[0]?.function?.name;
        return firstTool === 'search_forward_citations';
      metric: forward_citations_first_for_who_cites
    - type: javascript
