# Search Strategy Tests
# Verifies the agent uses correct tools and includes key search parameters
# Note: there are no query-builder tools — the model writes the query itself.
# EP/WO: model-written CQL rides in search_patents args.query; we check the CQL
# string carries the right elements (assignee, dates, CPC codes) as lowercase
# substrings (CQL terms appear as ta=term or inside ta="a phrase").
# US: uspto_api_guide supplies the request shape, then the model's own Lucene
# query rides in patent_api_request. When the model calls uspto_api_guide first
# (to get docs before searching), that's valid first-step behavior.

- vars:
    prompt: "Find US patents by Google about neural network inference optimization"
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return (parsed.tool_calls || []).some(tc =>
          tc.function?.name === 'uspto_api_guide' || tc.function?.name === 'patent_api_request'
        );
      metric: uspto_uses_correct_tool
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const directSearch = toolCalls.find(tc => tc.function?.name === 'patent_api_request');
        if (directSearch) {
          const args = JSON.parse(directSearch.function.arguments || '{}');
          const allArgs = JSON.stringify(args).toLowerCase();
          return allArgs.includes('google') && allArgs.includes('neural network');
        }
        // If using uspto_api_guide, that's a valid first step (get docs then
        // write the Lucene query for patent_api_request)
        const guideCall = toolCalls.find(tc => tc.function?.name === 'uspto_api_guide');
        if (guideCall) return true;
        return false;
      metric: uspto_includes_assignee_and_keywords
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'patent_api_request');
        if (!call) return true; // guide-first path is valid
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const d = JSON.stringify(args).toLowerCase();
        // The model-written Lucene request must mention the assignee (Google)
        return d.includes('google') || d.includes('alphabet');
      metric: uspto_args_include_assignee

- vars:
    prompt: "Search European patents by Samsung about wireless power transfer filed after 2023"
  assert:
    - type: javascript
      value: |
        // The model writes the CQL itself and calls search_patents directly —
        // there is no builder tool on the EP path.
        const parsed = JSON.parse(output);
        return (parsed.tool_calls || []).some(tc => tc.function?.name === 'search_patents');
      metric: epo_uses_search_patents
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const call = (parsed.tool_calls || []).find(tc => tc.function?.name === 'search_patents');
        if (!call) return false;
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const q = String(args.query || '').toLowerCase();
        return q.includes('samsung') && q.includes('wireless');
      metric: epo_includes_key_terms
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'search_patents');
        if (!call) return false;
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const q = String(args.query || '').toLowerCase();
        // Date constraint for "filed after 2023": accept the >=2023 or the stricter
        // >=2024 ("after 2023" = 2024 onward) reading in the model-written CQL.
        return q.includes('2023') || q.includes('2024');
      metric: epo_args_include_date_constraint

- vars:
    prompt: "Find US patents about autonomous vehicles from 2024 to present with CPC code G05D"
  assert:
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        return (parsed.tool_calls || []).some(tc =>
          tc.function?.name === 'uspto_api_guide' || tc.function?.name === 'patent_api_request'
        );
      metric: date_filter_uses_correct_tool
    - type: javascript
      value: |
        const parsed = JSON.parse(output);
        const toolCalls = parsed.tool_calls || [];
        const directSearch = toolCalls.find(tc => tc.function?.name === 'patent_api_request');
        if (directSearch) {
          const args = JSON.parse(directSearch.function.arguments || '{}');
          const allArgs = JSON.stringify(args).toLowerCase();
          return allArgs.includes('2024') && allArgs.includes('g05d');
        }
        // uspto_api_guide is valid first step — accept it
        const guideCall = toolCalls.find(tc => tc.function?.name === 'uspto_api_guide');
        if (guideCall) return true;
        return false;
      metric: includes_date_and_cpc_filters
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'patent_api_request');
        if (!call) return true; // guide-first path is valid
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const d = JSON.stringify(args).toLowerCase();
        // The model-written Lucene request must mention autonomous vehicles or driving
        return d.includes('autonomous') || d.includes('self-driving') || d.includes('vehicle') || d.includes('driving');
      metric: date_cpc_args_include_technical_domain

