        const out = JSON.parse(output);
        return (out.tool_calls || []).some(tc => tc.function?.name === 'build_patent_query');
      metric: pharma_epo_uses_build_query
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'build_patent_query');
        if (!call) return false;
