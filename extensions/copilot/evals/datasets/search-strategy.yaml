- vars:
    prompt: "Find European patents by Siemens about wind turbine blade de-icing filed after 2022, classification F03D"
  assert:
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'build_patent_query');
        if (!call) return false;
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const d = JSON.stringify(args).toLowerCase();
        const hasAssignee = d.includes('siemens');
        const hasTopic = d.includes('de-icing') || d.includes('deicing') || d.includes('de-ice') || d.includes('blade') || d.includes('turbine');
        const hasDate = d.includes('2022');
        const hasClassification = d.includes('f03d');
        return hasAssignee && hasTopic && hasDate && hasClassification;
      metric: four_constraint_query_carries_all_constraints
