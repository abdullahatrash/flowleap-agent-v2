        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'build_uspto_query');
        if (!call) return true; // guide-first path is valid
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const d = String(args.description || args.query || '').toLowerCase();
        // Must mention autonomous vehicles or driving
        return d.includes('autonomous') || d.includes('self-driving') || d.includes('vehicle') || d.includes('driving');
      metric: date_cpc_args_include_technical_domain

- vars:
    prompt: "Find EP patents about pharmaceutical drug delivery using nanoparticles filed by Pfizer"
  assert:
