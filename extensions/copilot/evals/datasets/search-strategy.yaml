- vars:
    prompt: "Find European patents by Siemens about wind turbine blade de-icing filed after 2022, classification F03D"
  assert:
    - type: javascript
      value: |
        // The model writes the CQL itself; the search_patents query string must
        // carry all four user constraints (assignee, topic, date, classification).
        const out = JSON.parse(output);
        const call = (out.tool_calls || []).find(tc => tc.function?.name === 'search_patents');
        if (!call) return false;
        const args = typeof call.function.arguments === 'string' ? JSON.parse(call.function.arguments) : call.function.arguments;
        const q = String(args.query || '').toLowerCase();
        const hasAssignee = q.includes('siemens');
        const hasTopic = q.includes('de-icing') || q.includes('deicing') || q.includes('de-ice') || q.includes('blade') || q.includes('turbine');
        // "filed after 2022" is correctly rendered as either pd>2022 or pd>=2023
        const hasDate = q.includes('2022') || q.includes('2023');
        const hasClassification = q.includes('f03d');
        return hasAssignee && hasTopic && hasDate && hasClassification;
      metric: four_constraint_query_carries_all_constraints
